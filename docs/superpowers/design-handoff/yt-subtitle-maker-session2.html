<body>
<div id="root"></div>
<script type="text/babel">
/* ─────────────────────────────────────────────
   DESIGN TOKENS (locked from Session 1)
───────────────────────────────────────────── */
const T = {
  bgBase:   "#0a0a0c",
  bgEl:     "#111114",
  glassLow: "rgba(255,255,255,0.04)",
  glassMid: "rgba(255,255,255,0.06)",
  glassHigh:"rgba(255,255,255,0.08)",
  borderSubtle: "rgba(255,255,255,0.06)",
  borderStrong: "rgba(255,255,255,0.12)",
  textPrimary:   "#f5f5f7",
  textSecondary: "#a1a1a6",
  textMuted:     "#6e6e73",
  accent:        "#fb923c",
  accentSoft:    "rgba(251,146,60,0.15)",
  accentDim:     "rgba(251,146,60,0.25)",
  success: "#5db872",
  warning: "#e8a55a",
  error:   "#ff5a5f",
  rXs:4, rSm:8, rMd:12, rLg:20, rXl:28, rPill:9999,
  xxs:4, xs:8, sm:12, md:16, lg:24, xl:32, xxl:48, section:64,
};

/* ─────────────────────────────────────────────
   SHARED PRIMITIVES
───────────────────────────────────────────── */
const SidebarItem = ({ icon, label, active }) => (
  <div style={{
    display:"flex", alignItems:"center", gap: T.sm,
    padding:`${T.xs}px ${T.md}px`, borderRadius: T.rMd,
    background: active ? T.accentSoft : "transparent",
    cursor:"pointer", position:"relative",
  }}>
    {active && <div style={{
      position:"absolute", left:0, top:"50%", transform:"translateY(-50%)",
      width:3, height:20, borderRadius:"0 2px 2px 0",
      background: T.accent,
    }}/>}
    <span style={{ fontSize:15, opacity: active ? 1 : 0.45, lineHeight:1 }}>{icon}</span>
    <span style={{
      fontFamily:"Inter,system-ui,sans-serif", fontSize:14,
      fontWeight: active ? 600 : 400,
      color: active ? T.textPrimary : T.textSecondary,
    }}>{label}</span>
  </div>
);

const AppShell = ({ active, topbarRight, children }) => (
  <div style={{ display:"flex", width:"100%", height:"100%", background: T.bgBase, overflow:"hidden" }}>
    {/* Sidebar */}
    <div style={{
      width:240, flexShrink:0, height:"100%",
      background: T.bgEl,
      borderRight:`1px solid ${T.borderSubtle}`,
      display:"flex", flexDirection:"column",
      padding:`${T.lg}px 0`,
    }}>
      <div style={{ height: T.lg }} />
      <div style={{ display:"flex", flexDirection:"column", gap: T.xxs, padding:`0 ${T.xs}px` }}>
        <SidebarItem icon="✦" label="Generate" active={active==="generate"} />
        <SidebarItem icon="◫" label="Library"  active={active==="library"}  />
        <SidebarItem icon="◷" label="History"  active={active==="history"}  />
        <SidebarItem icon="◎" label="Settings" active={active==="settings"} />
        <SidebarItem icon="◌" label="About"    active={active==="about"}    />
      </div>
      <div style={{ marginTop:"auto", padding:`0 ${T.lg}px` }}>
        <div style={{ display:"flex", alignItems:"center", gap: T.xs }}>
          <div style={{ width:6, height:6, borderRadius:9999, background: T.success }}/>
          <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textMuted }}>Backend connected</span>
        </div>
      </div>
    </div>
    {/* Main */}
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {/* Topbar */}
      <div style={{
        height:64, flexShrink:0,
        background:"rgba(17,17,20,0.85)",
        backdropFilter:"blur(40px) saturate(180%)",
        borderBottom:`1px solid ${T.borderSubtle}`,
        display:"flex", alignItems:"center",
        padding:`0 ${T.xl}px`,
        justifyContent:"space-between", zIndex:10,
      }}>
        <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight:600, color: T.textSecondary }}>
          {active === "library" ? "Library" : "History"}
        </span>
        <div style={{ display:"flex", alignItems:"center", gap: T.sm }}>
          {topbarRight}
          {[["⌘L","Logs"],["⚙","Settings"]].map(([ic,lb]) => (
            <div key={lb} style={{
              display:"flex", alignItems:"center", gap: T.xxs,
              padding:`${T.xxs}px ${T.sm}px`, borderRadius: T.rMd,
              background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
              cursor:"pointer",
            }}>
              <span style={{ fontSize:12 }}>{ic}</span>
              <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textSecondary }}>{lb}</span>
            </div>
          ))}
        </div>
      </div>
      {/* Content */}
      <div style={{ flex:1, overflowY:"auto", padding: T.xl }}>
        {children}
      </div>
    </div>
  </div>
);

const GlassCard = ({ children, style, padding }) => (
  <div style={{
    background: T.glassMid,
    backdropFilter:"blur(40px) saturate(180%)",
    border:`1px solid ${T.borderStrong}`,
    borderRadius: T.rLg,
    padding: padding ?? T.lg,
    ...style,
  }}>{children}</div>
);

const BadgePill = ({ children, accent, success, warning, error }) => {
  const bg    = accent ? T.accentSoft : success ? "rgba(93,184,114,0.12)" : warning ? "rgba(232,165,90,0.12)" : error ? "rgba(255,90,95,0.12)" : T.glassLow;
  const col   = accent ? T.accent : success ? T.success : warning ? T.warning : error ? T.error : T.textSecondary;
  const bord  = accent ? T.accentDim : success ? "rgba(93,184,114,0.25)" : warning ? "rgba(232,165,90,0.25)" : error ? "rgba(255,90,95,0.25)" : "rgba(255,255,255,0.08)";
  return (
    <span style={{
      display:"inline-flex", alignItems:"center",
      padding:`2px ${T.xs}px`, borderRadius: T.rPill,
      background: bg, border:`1px solid ${bord}`,
      fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600,
      color: col, letterSpacing:"0.4px", whiteSpace:"nowrap",
    }}>{children}</span>
  );
};

const FilterChip = ({ label, active }) => (
  <div style={{
    padding:`${T.xxs+2}px ${T.sm}px`, borderRadius: T.rPill,
    background: active ? T.accentSoft : T.glassLow,
    border:`1px solid ${active ? T.accentDim : T.borderSubtle}`,
    cursor:"pointer",
    fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight: active ? 600 : 400,
    color: active ? T.accent : T.textSecondary,
  }}>{label}</div>
);

const IconBtn = ({ children, danger }) => (
  <div style={{
    width:32, height:32, borderRadius:9999,
    background: danger ? "rgba(255,90,95,0.1)" : T.glassLow,
    border:`1px solid ${danger ? "rgba(255,90,95,0.2)" : T.borderSubtle}`,
    display:"flex", alignItems:"center", justifyContent:"center",
    cursor:"pointer", fontSize:13,
    color: danger ? T.error : T.textSecondary,
  }}>{children}</div>
);

/* ─── Fake thumbnail generator ─── */
const THUMB_GRADIENTS = [
  ["#1a1a2e","#e94560"],
  ["#0d1117","#58a6ff"],
  ["#1e1e1e","#f97316"],
  ["#0f0f1a","#a78bfa"],
  ["#1a2410","#5db872"],
  ["#1e0a0a","#ef4444"],
  ["#0a1a1e","#5eead4"],
  ["#1e1a0a","#fbbf24"],
];
const Thumb = ({ idx, w=192, h=108, playIcon=true }) => {
  const [a,b] = THUMB_GRADIENTS[idx % THUMB_GRADIENTS.length];
  return (
    <div style={{
      width:w, height:h, borderRadius: T.rMd, flexShrink:0,
      background:`linear-gradient(135deg, ${a} 0%, ${b} 100%)`,
      position:"relative", overflow:"hidden",
      border:`1px solid ${T.borderSubtle}`,
    }}>
      {playIcon && (
        <div style={{
          position:"absolute", inset:0, display:"flex",
          alignItems:"center", justifyContent:"center",
        }}>
          <div style={{
            width:32, height:32, borderRadius:9999,
            background:"rgba(0,0,0,0.55)",
            display:"flex", alignItems:"center", justifyContent:"center",
            fontSize:13, color:"#fff",
          }}>▶</div>
        </div>
      )}
    </div>
  );
};

/* ─────────────────────────────────────────────

───────────────────────────────────────────── */

  { id:"dQw4w9WgXcQ", title:"Never Gonna Give You Up", ch:"Rick Astley", dur:"3:33", lang:"EN→ZH", types:["SRT","Audio"], size:"4.2 MB", date:"May 3" },

/* ─────────────────────────────────────────────
   FRAME 1 — Library: Populated grid
───────────────────────────────────────────── */
const Frame1LibraryGrid = () => {
  const SearchBox = () => (
    <div style={{
      display:"flex", alignItems:"center", gap: T.sm,
      height:36, padding:`0 ${T.md}px`, borderRadius: T.rMd,
      background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
      width:220,
    }}>
      <span style={{ color: T.textMuted, fontSize:13 }}>⌕</span>
      <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color: T.textMuted }}>Search…</span>
    </div>
  );
  return (
    <AppShell active="library" topbarRight={<SearchBox/>}>
      {/* Filter + actions bar */}
      <div style={{ display:"flex", alignItems:"center", gap: T.sm, marginBottom: T.xl, flexWrap:"wrap" }}>
        <div style={{ display:"flex", gap: T.xs }}>
          {["All","Video","Audio","SRT"].map((f,i) => <FilterChip key={f} label={f} active={i===0}/>)}

            display:"flex", alignItems:"center", gap: T.xs,
            height:34, padding:`0 ${T.sm}px`, borderRadius: T.rMd,
            background: T.glassLow, border:`1px solid ${T.borderSubtle}`,

            <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color: T.textSecondary }}>Refresh</span>
          </div>
        </div>
      </div>

      {/* Grid 4-up */}
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap: T.lg }}>
        {LIBRARY_ITEMS.map((item, i) => (
          <div key={item.id} style={{
            background: T.glassMid,
            backdropFilter:"blur(40px) saturate(180%)",
            border:`1px solid ${T.borderStrong}`,
            borderRadius: T.rLg,
            overflow:"hidden", cursor:"pointer",
            transition:"transform 150ms, box-shadow 150ms",
          }}>
            {/* Thumbnail */}
            <div style={{ position:"relative" }}>
              <div style={{
                width:"100%", paddingTop:"56.25%",
                background:`linear-gradient(135deg, ${THUMB_GRADIENTS[i][0]} 0%, ${THUMB_GRADIENTS[i][1]} 100%)`,
                position:"relative",
              }}>
                <div style={{
                  position:"absolute", inset:0,
                  display:"flex", alignItems:"center", justifyContent:"center",
                }}>
                  <div style={{
                    width:36, height:36, borderRadius:9999,
                    background:"rgba(0,0,0,0.55)",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    fontSize:13, color:"#fff",
                  }}>▶</div>
                </div>
                {/* Duration badge */}
                <div style={{
                  position:"absolute", bottom: T.xxs, right: T.xxs,
                  background:"rgba(0,0,0,0.72)", borderRadius: T.rXs,
                  padding:`1px ${T.xxs+2}px`,
                  fontFamily:"JetBrains Mono,ui-monospace,monospace", fontSize:11, color:"#fff",
                }}>{item.dur}</div>
              </div>
            </div>
            {/* Meta */}
            <div style={{ padding: T.md }}>
              <div style={{
                fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight:600,
                color: T.textPrimary, lineHeight:1.4, marginBottom: T.xxs,
                display:"-webkit-box", WebkitLineClamp:2, WebkitBoxOrient:"vertical", overflow:"hidden",
              }}>{item.title}</div>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textSecondary, marginBottom: T.sm }}>
                {item.ch}
              </div>
              {/* Tags */}
              <div style={{ display:"flex", gap: T.xxs, flexWrap:"wrap", marginBottom: T.sm }}>
                {item.types.map(t => <BadgePill key={t}>{t}</BadgePill>)}
                <BadgePill>{item.lang}</BadgePill>
              </div>
              {/* Footer row */}
              <div style={{
                display:"flex", alignItems:"center", justifyContent:"space-between",
                paddingTop: T.xs, borderTop:`1px solid ${T.borderSubtle}`,
              }}>
                <span style={{ fontFamily:"JetBrains Mono,ui-monospace,monospace", fontSize:11, color: T.textMuted }}>{item.size}</span>
                <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:11, color: T.textMuted }}>{item.date}</span>
              </div>
            </div>
          </div>
        ))}
      </div>

      {/* Footer count */}
      <div style={{ textAlign:"center", marginTop: T.xl }}>
        <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color: T.textMuted }}>
          8 items · 3 with video · 6 with audio · 8 SRT files
        </span>
      </div>
    </AppShell>
  );
};

/* ─────────────────────────────────────────────
   FRAME 2 — Library: Empty state
───────────────────────────────────────────── */
const Frame2LibraryEmpty = () => (
  <AppShell active="library">
    {/* Filter bar — disabled */}

const ActionMenuItem = ({ icon, label, sub, danger, divider }) => {
  if (divider) return (
    <div style={{ height:1, background: T.borderSubtle, margin:`${T.xxs}px 0` }}/>
  );
  return (
    <div style={{
      display:"flex", alignItems:"center", gap: T.sm,
      padding:`${T.xs}px ${T.md}px`,
      borderRadius: T.rSm,
      cursor:"pointer",
      transition:"background 100ms",
    }}
      onMouseEnter={e => e.currentTarget.style.background = danger ? "rgba(255,90,95,0.08)" : T.glassLow}
      onMouseLeave={e => e.currentTarget.style.background = "transparent"}
    >
      <span style={{ fontSize:15, width:20, textAlign:"center", flexShrink:0, opacity: danger ? 1 : 0.7 }}>{icon}</span>
      <div style={{ flex:1 }}>
        <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight: danger ? 500 : 400, color: danger ? T.error : T.textPrimary }}>
          {label}
        </div>
        {sub && <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:11, color: T.textMuted, marginTop:1 }}>{sub}</div>}
      </div>
    </div>
  );
};
