<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Subtitle Maker v2.0 — Session 3 Mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0c; font-family: Inter, system-ui, sans-serif; }
    #root { height: 100%; }
    @keyframes pulse-dot { 0%,100%{opacity:0.4;transform:scale(0.7)} 50%{opacity:1;transform:scale(1.2)} }
    @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ─────────────────────────────────────────────
   TOKENS (locked Session 1)
───────────────────────────────────────────── */
const T = {
  bgBase:"#0a0a0c", bgEl:"#111114",
  glassLow:"rgba(255,255,255,0.04)", glassMid:"rgba(255,255,255,0.06)", glassHigh:"rgba(255,255,255,0.08)",
  borderSubtle:"rgba(255,255,255,0.06)", borderStrong:"rgba(255,255,255,0.12)",
  textPrimary:"#f5f5f7", textSecondary:"#a1a1a6", textMuted:"#6e6e73",
  accent:"#fb923c", accentSoft:"rgba(251,146,60,0.15)", accentDim:"rgba(251,146,60,0.25)",
  success:"#5db872", warning:"#e8a55a", error:"#ff5a5f",
  rXs:4, rSm:8, rMd:12, rLg:20, rXl:28, rPill:9999,
  xxs:4, xs:8, sm:12, md:16, lg:24, xl:32, xxl:48,
};

/* ─────────────────────────────────────────────
   SHARED PRIMITIVES
───────────────────────────────────────────── */
const Label = ({ children }) => (
  <div style={{
    fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600,
    color:T.textMuted, letterSpacing:"1.5px", textTransform:"uppercase", marginBottom:T.xs,
  }}>{children}</div>
);

const GlassCard = ({ children, style, padding }) => (
  <div style={{
    background:T.glassMid, backdropFilter:"blur(40px) saturate(180%)",
    border:`1px solid ${T.borderStrong}`, borderRadius:T.rLg,
    padding: padding ?? T.lg, ...style,
  }}>{children}</div>
);

const SectionCard = ({ title, children, style }) => (
  <GlassCard style={style}>
    <div style={{
      fontFamily:"Inter,system-ui,sans-serif", fontSize:15, fontWeight:600,
      color:T.textPrimary, marginBottom:T.lg, paddingBottom:T.md,
      borderBottom:`1px solid ${T.borderSubtle}`,
    }}>{title}</div>
    {children}
  </GlassCard>
);

const TextInput = ({ value, placeholder, focused, mono, suffix }) => (
  <div style={{
    display:"flex", alignItems:"center",
    height:44, borderRadius:T.rMd,
    background:T.glassLow,
    border:`${focused ? 2 : 1}px solid ${focused ? T.accent : T.borderSubtle}`,
    boxShadow: focused ? `0 0 0 3px ${T.accentSoft}` : "none",
    padding:`0 ${T.md}px`, gap:T.xs, overflow:"hidden",
  }}>
    <span style={{
      flex:1,
      fontFamily: mono ? "JetBrains Mono,ui-monospace,monospace" : "Inter,system-ui,sans-serif",
      fontSize:13, color: value ? T.textPrimary : T.textMuted,
    }}>{value || placeholder}</span>
    {suffix}
  </div>
);

const Btn = ({ children, accent, ghost, danger, small }) => {
  const h = small ? 32 : 36;
  const px = small ? T.sm : T.md;
  let bg = T.glassLow, border = `1px solid ${T.borderSubtle}`, col = T.textSecondary;
  if (accent)  { bg = `linear-gradient(135deg,${T.accent},#f97316)`; border="none"; col="#fff"; }
  if (danger)  { bg = "rgba(255,90,95,0.1)"; border=`1px solid rgba(255,90,95,0.22)`; col=T.error; }
  if (ghost)   { bg = "transparent"; border=`1px solid ${T.borderSubtle}`; }
  return (
    <div style={{
      height:h, padding:`0 ${px}px`, borderRadius:T.rMd,
      background:bg, border, cursor:"pointer",
      display:"inline-flex", alignItems:"center", justifyContent:"center", gap:T.xxs,
      boxShadow: accent ? `0 3px 10px rgba(251,146,60,0.3)` : "none",
      flexShrink:0,
    }}>
      <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight: accent ? 600 : 400, color:col, whiteSpace:"nowrap" }}>{children}</span>
    </div>
  );
};

const Dropdown = ({ value, style }) => (
  <div style={{
    display:"flex", alignItems:"center", justifyContent:"space-between",
    padding:`0 ${T.md}px`, height:44, borderRadius:T.rMd,
    background:T.glassLow, border:`1px solid ${T.borderSubtle}`,
    cursor:"pointer", ...style,
  }}>
    <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color:T.textPrimary }}>{value}</span>
    <span style={{ color:T.textMuted, fontSize:11 }}>▾</span>
  </div>
);

const Toggle = ({ on, label, helper }) => (
  <div style={{ display:"flex", alignItems:"flex-start", gap:T.md }}>
    <div style={{
      width:36, height:20, borderRadius:9999, flexShrink:0, marginTop:2,
      background: on ? T.accent : T.glassLow,
      border:`1px solid ${on ? T.accent : T.borderStrong}`,
      position:"relative", cursor:"pointer",
    }}>
      <div style={{
        position:"absolute", top:2,
        left: on ? 18 : 2,
        width:14, height:14, borderRadius:9999,
        background: on ? "#fff" : T.textMuted,
        transition:"left 150ms cubic-bezier(0.34,1.56,0.64,1)",
      }}/>
    </div>
    <div>
      <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color:T.textPrimary }}>{label}</div>
      {helper && <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textMuted, marginTop:2, lineHeight:1.5 }}>{helper}</div>}
    </div>
  </div>
);

const StatusDot = ({ status }) => {
  // status: ok | untested | error
  const col = status==="ok" ? T.success : status==="error" ? T.error : T.warning;
  const label = status==="ok" ? "Working" : status==="error" ? "Failed" : "Untested";
  return (
    <div style={{ display:"flex", alignItems:"center", gap:T.xs }}>
      <div style={{ width:8, height:8, borderRadius:9999, background:col, flexShrink:0,
        animation: status==="ok" ? "pulse-dot 2s ease-in-out infinite" : "none",
      }}/>
      <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, fontWeight:600, color:col }}>{label}</span>
    </div>
  );
};

const Divider = ({ style }) => (
  <div style={{ height:1, background:T.borderSubtle, margin:`${T.md}px 0`, ...style }}/>
);

const SegmentedControl = ({ options, active }) => (
  <div style={{
    display:"inline-flex", background:T.glassLow,
    border:`1px solid ${T.borderSubtle}`, borderRadius:T.rMd, padding:T.xxs, gap:T.xxs,
  }}>
    {options.map(opt => (
      <div key={opt} style={{
        padding:`${T.xxs+2}px ${T.sm}px`, borderRadius:T.rSm, cursor:"pointer",
        background: opt===active ? T.accentSoft : "transparent",
        border:`1px solid ${opt===active ? T.accentDim : "transparent"}`,
      }}>
        <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight: opt===active ? 600 : 400, color: opt===active ? T.accent : T.textSecondary }}>
          {opt}
        </span>
      </div>
    ))}
  </div>
);

const MaskedInput = ({ value, placeholder }) => (
  <div style={{ display:"flex", gap:T.xs }}>
    <div style={{
      flex:1, height:44, borderRadius:T.rMd,
      background:T.glassLow, border:`1px solid ${T.borderSubtle}`,
      display:"flex", alignItems:"center", padding:`0 ${T.md}px`, gap:T.xs,
    }}>
      <span style={{ fontFamily:"JetBrains Mono,ui-monospace,monospace", fontSize:13, color:T.textPrimary, letterSpacing:"3px" }}>
        {value ? "••••••••••••••••••••" : ""}
      </span>
      {!value && <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, color:T.textMuted }}>{placeholder}</span>}
      <span style={{ marginLeft:"auto", color:T.textMuted, fontSize:12, cursor:"pointer" }}>👁</span>
    </div>
    <Btn small>Test</Btn>
  </div>
);

/* ─────────────────────────────────────────────
   FULL DESKTOP SHELL
───────────────────────────────────────────── */
const SidebarItem = ({ icon, label, active }) => (
  <div style={{
    display:"flex", alignItems:"center", gap:T.sm,
    padding:`${T.xs}px ${T.md}px`, borderRadius:T.rMd,
    background: active ? T.accentSoft : "transparent",
    cursor:"pointer", position:"relative",
  }}>
    {active && <div style={{
      position:"absolute", left:0, top:"50%", transform:"translateY(-50%)",
      width:3, height:20, borderRadius:"0 2px 2px 0", background:T.accent,
    }}/>}
    <span style={{ fontSize:15, opacity: active ? 1 : 0.45, lineHeight:1 }}>{icon}</span>
    <span style={{
      fontFamily:"Inter,system-ui,sans-serif", fontSize:14,
      fontWeight: active ? 600 : 400,
      color: active ? T.textPrimary : T.textSecondary,
    }}>{label}</span>
  </div>
);

const DesktopShell = ({ active, children, overlay }) => (
  <div style={{ display:"flex", width:"100%", height:"100%", background:T.bgBase, overflow:"hidden", position:"relative" }}>
    {/* Sidebar */}
    <div style={{
      width:240, flexShrink:0, height:"100%",
      background:T.bgEl, borderRight:`1px solid ${T.borderSubtle}`,
      display:"flex", flexDirection:"column", padding:`${T.lg}px 0`,
    }}>
      <div style={{ height: T.lg }} />
      <div style={{ display:"flex", flexDirection:"column", gap:T.xxs, padding:`0 ${T.xs}px` }}>
        <SidebarItem icon="✦" label="Generate" active={active==="generate"} />
        <SidebarItem icon="◫" label="Library"  active={active==="library"} />
        <SidebarItem icon="◷" label="History"  active={active==="history"} />
        <SidebarItem icon="◎" label="Settings" active={active==="settings"} />
        <SidebarItem icon="◌" label="About"    active={active==="about"} />
      </div>
      <div style={{ marginTop:"auto", padding:`0 ${T.lg}px` }}>
        <div style={{ display:"flex", alignItems:"center", gap:T.xs }}>
          <div style={{ width:6, height:6, borderRadius:9999, background:T.success }}/>
          <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textMuted }}>Backend connected</span>
        </div>
      </div>
    </div>
    {/* Main */}
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      <div style={{
        height:64, flexShrink:0,
        background:"rgba(17,17,20,0.85)", backdropFilter:"blur(40px) saturate(180%)",
        borderBottom:`1px solid ${T.borderSubtle}`,
        display:"flex", alignItems:"center", padding:`0 ${T.xl}px`,
        justifyContent:"space-between", zIndex:10,
      }}>
        <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight:600, color:T.textSecondary }}>
          {active==="settings" ? "Settings" : active==="about" ? "About" : active}
        </span>
        <div style={{ display:"flex", alignItems:"center", gap:T.sm }}>
          {[["⌘L","Logs"],["⚙","Settings"]].map(([ic,lb]) => (
            <div key={lb} style={{
              display:"flex", alignItems:"center", gap:T.xxs,
              padding:`${T.xxs}px ${T.sm}px`, borderRadius:T.rMd,
              background:T.glassLow, border:`1px solid ${T.borderSubtle}`, cursor:"pointer",
            }}>
              <span style={{ fontSize:12 }}>{ic}</span>
              <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textSecondary }}>{lb}</span>
            </div>
          ))}
        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", padding:T.xl }}>
        <div style={{ maxWidth:720, margin:"0 auto" }}>{children}</div>
      </div>
    </div>
    {overlay}
  </div>
);

/* ─────────────────────────────────────────────
   FRAME 1 — Settings: Full page (all 5 sections expanded)
───────────────────────────────────────────── */
const Frame1Settings = () => (
  <DesktopShell active="settings">
    <div style={{ display:"flex", flexDirection:"column", gap:T.lg }}>

      {/* § General */}
      <SectionCard title="General">
        <div style={{ display:"flex", flexDirection:"column", gap:T.md }}>
          <div>
            <Label>Backend URL</Label>
            <div style={{ display:"flex", gap:T.xs }}>
              <div style={{ flex:1 }}>
                <TextInput value="http://127.0.0.1:8000" mono />
              </div>
              <Btn small>Test</Btn>
              <StatusDot status="ok" />
            </div>
          </div>
          <div>
            <Label>Download folder</Label>
            <div style={{ display:"flex", gap:T.xs }}>
              <div style={{ flex:1 }}>
                <TextInput value="/Users/user/Movies/YTSubtitles" mono />
              </div>
              <Btn small>📁 Browse</Btn>
            </div>
          </div>
        </div>
      </SectionCard>

      {/* § Cookies */}
      <SectionCard title="Cookies (YouTube)">
        <div style={{ display:"flex", flexDirection:"column", gap:T.md }}>
          <div>
            <Label>Cookie source</Label>
            <Dropdown value="Firefox  ·  Recommended" />
          </div>
          <div>
            <Label>Browser profile</Label>
            <TextInput value="default-release" />
          </div>
          <div>
            <Label>Cookies.txt fallback path</Label>
            <TextInput placeholder="Optional — /path/to/cookies.txt" />
          </div>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <StatusDot status="ok" />
            <Btn small>Run cookie test</Btn>
          </div>
        </div>
      </SectionCard>

      {/* § STT Engine */}
      <SectionCard title="STT Engine">
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:T.md }}>
          <div>
            <Label>Default engine</Label>
            <Dropdown value="faster-whisper  ⭐" />
          </div>
          <div>
            <Label>Default model</Label>
            <Dropdown value="turbo" />
          </div>
          <div>
            <Label>Default device</Label>
            <Dropdown value="Auto" />
          </div>
          <div>
            <Label>Default source language</Label>
            <Dropdown value="English" />
          </div>
        </div>
        <Divider />
        <Toggle on label="Try YouTube auto-captions first"
          helper="Skips local transcription when captions are available — much faster." />
        <div style={{ marginTop:T.md }}>
          <div style={{
            padding:`${T.sm}px ${T.md}px`, borderRadius:T.rMd,
            background:"rgba(232,165,90,0.08)", border:`1px solid rgba(232,165,90,0.2)`,
          }}>
            <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.warning, lineHeight:1.6 }}>
              <strong>Default language is required.</strong> Setting "English" (not Auto) prevents Whisper from misdetecting on intros and music sections.
            </div>
          </div>
        </div>
      </SectionCard>

      {/* § Translation */}
      <SectionCard title="Translation">
        <div style={{ marginBottom:T.md }}>
          <Label>Provider</Label>
          <SegmentedControl options={["Gemini","Local AI","OpenAI-compatible"]} active="Gemini" />
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:T.md, marginBottom:T.md }}>
          <div>
            <Label>Default target language</Label>
            <Dropdown value="Chinese (Simplified)" />
          </div>
          <div>
            <Label>Model</Label>
            <Dropdown value="gemini-2.5-flash-lite" />
          </div>
        </div>
        <div style={{ marginBottom:T.md }}>
          <Label>Gemini API key</Label>
          <MaskedInput value="AIzaSy..." />
        </div>
        <Divider />
        <div style={{ display:"flex", flexDirection:"column", gap:T.sm }}>
          <Toggle on label="Auto-translate title" helper="Translates video title immediately after metadata loads." />
          <Toggle on label="Enable translation" />
        </div>
      </SectionCard>

      {/* § Advanced */}
      <SectionCard title="Advanced">
        <div style={{ display:"flex", flexDirection:"column", gap:T.md }}>
          <div>
            <Label>MPV executable path</Label>
            <TextInput placeholder="Leave blank to use system PATH" mono />
          </div>
          <div>
            <Label>Whisper cache directory</Label>
            <TextInput value="~/.cache/whisper" mono />
          </div>
          <div>
            <Label>Logs verbosity</Label>
            <Dropdown value="Info" style={{ maxWidth:200 }} />
          </div>
          <Toggle on label="Enable FFmpeg 16kHz pre-resample"
            helper="Converts audio to 16kHz mono before feeding Whisper — improves timestamp accuracy." />
          <Divider />
          <div>
            <Btn danger>Reset to defaults</Btn>
          </div>
        </div>
      </SectionCard>

      {/* Sticky save row */}
      <div style={{
        display:"flex", justifyContent:"flex-end", gap:T.sm,
        position:"sticky", bottom:0, padding:`${T.md}px 0`,
      }}>
        <Btn ghost>Discard changes</Btn>
        <Btn accent>Save settings</Btn>
      </div>
    </div>
  </DesktopShell>
);

/* ─────────────────────────────────────────────
   FRAME 2 — Settings: Cookies section in Working / Failed state
───────────────────────────────────────────── */
const CookiesCard = ({ state }) => {
  const isWorking = state === "ok";
  const isFailed  = state === "error";
  return (
    <GlassCard>
      <div style={{
        fontFamily:"Inter,system-ui,sans-serif", fontSize:15, fontWeight:600,
        color:T.textPrimary, marginBottom:T.lg, paddingBottom:T.md,
        borderBottom:`1px solid ${T.borderSubtle}`,
        display:"flex", alignItems:"center", justifyContent:"space-between",
      }}>
        <span>Cookies (YouTube)</span>
        <StatusDot status={state} />
      </div>

      <div style={{ display:"flex", flexDirection:"column", gap:T.md }}>
        <div>
          <Label>Cookie source</Label>
          <Dropdown value={isWorking ? "Firefox  ·  Recommended" : "Chrome  ·  ⚠ may fail"} />
        </div>
        <div>
          <Label>Browser profile</Label>
          <TextInput value={isWorking ? "default-release" : "Default"} />
        </div>
        <div>
          <Label>Cookies.txt fallback</Label>
          <TextInput placeholder="Optional — /path/to/cookies.txt" />
        </div>

        {/* Status block */}
        {isWorking && (
          <div style={{
            padding:`${T.sm}px ${T.md}px`, borderRadius:T.rMd,
            background:"rgba(93,184,114,0.08)", border:`1px solid rgba(93,184,114,0.22)`,
            display:"flex", alignItems:"flex-start", gap:T.sm,
          }}>
            <div style={{ width:8, height:8, borderRadius:9999, background:T.success, marginTop:4, flexShrink:0,
              animation:"pulse-dot 2s ease-in-out infinite" }}/>
            <div>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight:600, color:T.success }}>Cookie test passed</div>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textSecondary, marginTop:2 }}>
                Downloaded 3s of audio from a test video — cookies are working correctly.
              </div>
            </div>
          </div>
        )}

        {isFailed && (
          <>
            <div style={{
              padding:`${T.sm}px ${T.md}px`, borderRadius:T.rMd,
              background:"rgba(255,90,95,0.08)", border:`1px solid rgba(255,90,95,0.22)`,
            }}>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:13, fontWeight:600, color:T.error, marginBottom:T.xxs }}>
                Failed: App-Bound Encryption blocked cookie access
              </div>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textSecondary, lineHeight:1.6 }}>
                Chrome 127+ uses App-Bound Encryption that prevents external tools from reading cookies. Switch to Firefox to avoid this issue.
              </div>
            </div>
            {/* Warning advisory */}
            <div style={{
              padding:`${T.sm}px ${T.md}px`, borderRadius:T.rMd,
              background:"rgba(232,165,90,0.08)", border:`1px solid rgba(232,165,90,0.2)`,
            }}>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, fontWeight:600, color:T.warning, marginBottom:T.xxs }}>
                Chrome / Edge / Brave / Opera advisory
              </div>
              <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color:T.textSecondary, lineHeight:1.6 }}>
                Since Chrome 127, Google uses App-Bound Encryption to protect cookies. yt-dlp cannot read them without elevated permissions. <strong style={{ color:T.textPrimary }}>Use Firefox or a cookies.txt file instead.</strong>
              </div>
            </div>
          </>
        )}

        <div style={{ display:"flex", justifyContent:"flex-end" }}>
          <Btn small>Run cookie test</Btn>
        </div>
      </div>
    </GlassCard>
  );
};

const Frame2CookieStates = () => (
  <DesktopShell active="settings">
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:T.lg }}>
      <div>
        <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600, color:T.textMuted, letterSpacing:"1.5px", textTransform:"uppercase", marginBottom:T.sm }}>
          Working state — Firefox
        </div>
        <CookiesCard state="ok" />
      </div>
      <div>
        <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600, color:T.textMuted, letterSpacing:"1.5px", textTransform:"uppercase", marginBottom:T.sm }}>
          Failed state — Chrome
        </div>
        <CookiesCard state="error" />
      </div>
    </div>
    {/* Untested below */}
    <div style={{ marginTop:T.xl }}>
      <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600, color:T.textMuted, letterSpacing:"1.5px", textTransform:"uppercase", marginBottom:T.sm }}>
        Untested state
      </div>
      <GlassCard>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:T.md }}>
          <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:15, fontWeight:600, color:T.textPrimary }}>Cookies (YouTube)</span>
