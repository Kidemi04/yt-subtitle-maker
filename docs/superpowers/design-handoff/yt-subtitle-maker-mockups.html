<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT Subtitle Maker v2.0 — Session 1 Mockups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0c; font-family: Inter, system-ui, sans-serif; }
    #root { height: 100%; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/* ─────────────────────────────────────────────
   DESIGN TOKENS (from spec §0, §4, §10)
───────────────────────────────────────────── */
const T = {
  // Colors
  bgBase:   "#0a0a0c",
  bgEl:     "#111114",
  glassLow: "rgba(255,255,255,0.04)",
  glassMid: "rgba(255,255,255,0.06)",
  glassHigh:"rgba(255,255,255,0.08)",
  borderSubtle: "rgba(255,255,255,0.06)",
  borderStrong: "rgba(255,255,255,0.12)",
  textPrimary: "#f5f5f7",
  textSecondary: "#a1a1a6",
  textMuted: "#6e6e73",
  accent:     "#fb923c",
  accentSoft: "rgba(251,146,60,0.15)",
  accentDim:  "rgba(251,146,60,0.25)",
  success: "#5db872",
  warning: "#e8a55a",
  error:   "#ff5a5f",
  // Radii
  rXs:4, rSm:8, rMd:12, rLg:20, rXl:28, rPill:9999,
  // Spacing
  xxs:4, xs:8, sm:12, md:16, lg:24, xl:32, xxl:48, section:64,
};

/* ─────────────────────────────────────────────
   SHARED CHROME: Sidebar + Topbar
───────────────────────────────────────────── */
const SidebarIcon = ({ icon, label, active }) => (
  <div style={{
    display:"flex", alignItems:"center", gap: T.sm,
    padding: `${T.xs}px ${T.md}px`, borderRadius: T.rMd,
    background: active ? T.accentSoft : "transparent",
    cursor:"pointer", position:"relative",
    transition: "background 200ms",
  }}>
    {active && <div style={{
      position:"absolute", left:0, top:"50%", transform:"translateY(-50%)",
      width:3, height:20, borderRadius:"0 2px 2px 0",
      background: T.accent,
    }}/>}
    <span style={{ fontSize:16, opacity: active ? 1 : 0.5, lineHeight:1 }}>{icon}</span>
    <span style={{
      fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight: active ? 600 : 400,
      color: active ? T.textPrimary : T.textSecondary,
      letterSpacing:"-0.1px",
    }}>{label}</span>
  </div>
);

const AppShell = ({ active, children }) => (
  <div style={{ display:"flex", width:"100%", height:"100%", background: T.bgBase, position:"relative", overflow:"hidden" }}>
    {/* Sidebar */}
    <div style={{
      width:240, flexShrink:0, height:"100%",
      background: T.bgEl,
      borderRight: `1px solid ${T.borderSubtle}`,
      display:"flex", flexDirection:"column",
      padding: `${T.lg}px 0`,
    }}>
      <div style={{ height: T.lg }} />
      {/* Nav */}
      <div style={{ display:"flex", flexDirection:"column", gap: T.xxs, padding:`0 ${T.xs}px` }}>
        <SidebarIcon icon="✦" label="Generate" active={active==="generate"} />
        <SidebarIcon icon="◫" label="Library" active={active==="library"} />
        <SidebarIcon icon="◷" label="History" active={active==="history"} />
        <SidebarIcon icon="◎" label="Settings" active={active==="settings"} />
        <SidebarIcon icon="◌" label="About" active={active==="about"} />
      </div>
      {/* Backend status */}
      <div style={{ marginTop:"auto", padding:`0 ${T.lg}px` }}>
        <div style={{ display:"flex", alignItems:"center", gap: T.xs }}>
          <div style={{ width:6, height:6, borderRadius:9999, background: T.success }}/>
          <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textMuted }}>Backend connected</span>
        </div>
      </div>
    </div>

    {/* Main */}
    <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>
      {/* Topbar */}
      <div style={{
        height:64, flexShrink:0,
        background: "rgba(17,17,20,0.8)",
        backdropFilter:"blur(40px) saturate(180%)",
        borderBottom: `1px solid ${T.borderSubtle}`,
        display:"flex", alignItems:"center",
        padding:`0 ${T.xl}px`,
        justifyContent:"space-between",
        zIndex:10,
      }}>
        <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight:600, color: T.textSecondary, letterSpacing:"-0.1px" }}>
          {active === "generate" && <><span style={{color:T.textMuted}}>Generate</span></>}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap: T.sm }}>
          {[["⌘L","Logs"],["⚙","Settings"]].map(([ic,lb]) => (
            <div key={lb} style={{
              display:"flex", alignItems:"center", gap: T.xxs,
              padding:`${T.xxs}px ${T.sm}px`, borderRadius: T.rMd,
              background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
              cursor:"pointer",
            }}>
              <span style={{ fontSize:12 }}>{ic}</span>
              <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textSecondary }}>{lb}</span>
            </div>
          ))}
        </div>
      </div>
      {/* Content */}
      <div style={{ flex:1, overflowY:"auto", padding: T.xl }}>
        <div style={{ maxWidth:960, margin:"0 auto" }}>
          {children}
        </div>
      </div>
    </div>
  </div>
);

/* ─────────────────────────────────────────────
   REUSABLE UI PRIMITIVES
───────────────────────────────────────────── */
const GlassCard = ({ children, style, padding }) => (
  <div style={{
    background: T.glassMid,
    backdropFilter:"blur(40px) saturate(180%)",
    border: `1px solid ${T.borderStrong}`,
    borderRadius: T.rLg,
    padding: padding ?? T.lg,
    ...style,
  }}>{children}</div>
);

const BadgePill = ({ children, accent, success, warning }) => {
  const bg = accent ? T.accentSoft : success ? "rgba(93,184,114,0.12)" : warning ? "rgba(232,165,90,0.12)" : T.glassLow;
  const color = accent ? T.accent : success ? T.success : warning ? T.warning : T.textSecondary;
  return (
    <span style={{
      display:"inline-flex", alignItems:"center",
      padding:`2px ${T.xs}px`, borderRadius: T.rPill,
      background: bg, border: `1px solid ${accent ? T.accentDim : "rgba(255,255,255,0.08)"}`,
      fontFamily:"Inter,system-ui,sans-serif", fontSize:11, fontWeight:600,
      color, letterSpacing:"0.5px", textTransform:"uppercase",
    }}>{children}</span>
  );
};

const Divider = () => (
  <div style={{ height:1, background: T.borderSubtle, margin:`${T.md}px 0` }}/>
);

const Radio = ({ checked, label, sub, recommended }) => (
  <div style={{
    display:"flex", alignItems:"flex-start", gap: T.sm,
    padding: `${T.sm}px ${T.md}px`,
    borderRadius: T.rMd,
    background: checked ? T.accentSoft : "transparent",
    border: `1px solid ${checked ? T.accentDim : T.borderSubtle}`,
    cursor:"pointer",
    transition:"all 150ms",
  }}>
    <div style={{
      width:16, height:16, borderRadius:9999, marginTop:2,
      border: `2px solid ${checked ? T.accent : T.textMuted}`,
      display:"flex", alignItems:"center", justifyContent:"center",
      flexShrink:0,
    }}>
      {checked && <div style={{ width:7, height:7, borderRadius:9999, background: T.accent }}/>}
    </div>
    <div style={{ flex:1 }}>
      <div style={{ display:"flex", alignItems:"center", gap: T.xs }}>
        <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight: checked ? 600 : 400, color: T.textPrimary }}>{label}</span>
        {recommended && <BadgePill accent>Recommended</BadgePill>}
      </div>
      {sub && <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textMuted, marginTop:2 }}>{sub}</div>}
    </div>
  </div>
);

const Toggle = ({ on, label }) => (
  <div style={{ display:"flex", alignItems:"center", gap: T.sm }}>
    <div style={{
      width:36, height:20, borderRadius:9999,
      background: on ? T.accent : T.glassLow,
      border: `1px solid ${on ? T.accent : T.borderStrong}`,
      position:"relative", cursor:"pointer", flexShrink:0,
    }}>
      <div style={{
        position:"absolute", top:2,
        left: on ? 18 : 2,
        width:14, height:14, borderRadius:9999,
        background: on ? "#fff" : T.textMuted,
        transition:"left 150ms cubic-bezier(0.34,1.56,0.64,1)",
      }}/>
    </div>
    <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textSecondary }}>{label}</span>
  </div>
);

const Dropdown = ({ value, style }) => (
  <div style={{
    display:"flex", alignItems:"center", justifyContent:"space-between",
    padding:`0 ${T.md}px`, height:44, borderRadius: T.rMd,
    background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
    cursor:"pointer", ...style,
  }}>
    <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textPrimary }}>{value}</span>
    <span style={{ color: T.textMuted, fontSize:11 }}>▾</span>
  </div>
);

const StepPill = ({ n, label, state }) => {
  // state: done | active | pending
  const bg = state==="done" ? T.success : state==="active" ? T.accent : T.glassLow;
  const textColor = state==="pending" ? T.textMuted : "#fff";
  return (
    <div style={{
      display:"flex", alignItems:"center", gap: T.xxs,
      padding:`${T.xxs}px ${T.sm}px`, borderRadius: T.rPill,
      background: state==="done" ? "rgba(93,184,114,0.12)" : state==="active" ? T.accentSoft : T.glassLow,
      border:`1px solid ${state==="done" ? "rgba(93,184,114,0.25)" : state==="active" ? T.accentDim : T.borderSubtle}`,
    }}>
      <div style={{
        width:18, height:18, borderRadius:9999,
        background: bg,
        display:"flex", alignItems:"center", justifyContent:"center",
        fontSize:10, fontWeight:700, color:"#fff", fontFamily:"Inter,system-ui,sans-serif",
        position:"relative",
      }}>
        {state==="done" ? "✓" : state==="active" ? (
          <div style={{
            width:8, height:8, borderRadius:9999, background: T.accent,
            animation:"pulse 1.2s ease-in-out infinite",
          }}/>
        ) : n}
      </div>
      <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, fontWeight: state==="active" ? 600 : 400, color: state==="pending" ? T.textMuted : T.textPrimary }}>{label}</span>
    </div>
  );
};

/* ─────────────────────────────────────────────
   FRAME 1 — Init Screen (model picker state)
───────────────────────────────────────────── */
const Frame1Init = () => {
  const models = [
    { id:"tiny",   size:"~75 MB",   desc:"Fastest, lowest accuracy. Good for quick previews.", vram:"~1 GB RAM" },
    { id:"base",   size:"~150 MB",  desc:"Fast, decent accuracy.", vram:"~1 GB RAM" },
    { id:"small",  size:"~500 MB",  desc:"Balanced speed and quality.", vram:"~2 GB RAM" },
    { id:"medium", size:"~1.5 GB",  desc:"Accurate, slower transcription.", vram:"~5 GB RAM" },
    { id:"turbo",  size:"~1.5 GB",  desc:"Fast + accurate — best of both worlds.", vram:"~6 GB VRAM", rec:true },
  ];
  return (
    <div style={{
      width:"100%", height:"100%", background: T.bgBase,
      display:"flex", alignItems:"center", justifyContent:"center",
    }}>
      {/* Ambient glow */}
      <div style={{
        position:"absolute", top:"30%", left:"50%", transform:"translate(-50%,-50%)",
        width:600, height:400, borderRadius:"50%",
        background:`radial-gradient(ellipse, rgba(251,146,60,0.07) 0%, transparent 70%)`,
        pointerEvents:"none",
      }}/>
      <div style={{
        width:480,
        background: T.glassMid,
        backdropFilter:"blur(60px) saturate(200%)",
        border:`1px solid ${T.borderStrong}`,
        boxShadow:`0 24px 48px rgba(0,0,0,0.4)`,
        borderRadius: T.rXl,
        padding: T.xl,
        position:"relative",
      }}>
        {/* Header */}
        <div style={{ textAlign:"center", marginBottom: T.lg }}>
          <div style={{
            fontFamily:"Fraunces,ui-serif,serif", fontSize:28, fontWeight:400,
            color: T.textPrimary, letterSpacing:"-0.5px", lineHeight:1.2,
          }}>Setting up your studio</div>
          <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textSecondary, marginTop: T.xs, lineHeight:1.55 }}>
            Choose a Whisper model to download. This only happens once.
          </div>
        </div>

        <Divider/>

        {/* Model list */}
        <div style={{ display:"flex", flexDirection:"column", gap: T.xs, marginBottom: T.lg }}>
          {models.map(m => (
            <div key={m.id} style={{
              display:"flex", alignItems:"center",
              padding:`${T.sm}px ${T.md}px`,
              borderRadius: T.rMd,
              background: m.rec ? T.accentSoft : T.glassLow,
              border:`1px solid ${m.rec ? T.accentDim : T.borderSubtle}`,
              cursor:"pointer",
            }}>
              {/* Radio */}
              <div style={{
                width:16, height:16, borderRadius:9999, marginRight: T.sm,
                border:`2px solid ${m.rec ? T.accent : T.textMuted}`,
                display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0,
              }}>
                {m.rec && <div style={{ width:7, height:7, borderRadius:9999, background: T.accent }}/>}
              </div>
              {/* Info */}
              <div style={{ flex:1 }}>
                <div style={{ display:"flex", alignItems:"center", gap: T.xs }}>
                  <span style={{
                    fontFamily:"Inter,system-ui,sans-serif", fontSize:14,
                    fontWeight: m.rec ? 600 : 400, color: T.textPrimary,
                  }}>{m.id}</span>
                  <span style={{ fontFamily:"JetBrains Mono,ui-monospace,monospace", fontSize:11, color: T.textMuted }}>{m.size}</span>
                  {m.rec && <BadgePill accent>⭐ Default</BadgePill>}
                </div>
                <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textMuted, marginTop:2 }}>
                  {m.desc} · {m.vram}
                </div>
              </div>
            </div>
          ))}
        </div>

        {/* CTA */}
        <div style={{
          width:"100%", height:56, borderRadius: T.rMd,
          background:`linear-gradient(135deg, ${T.accent}, #f97316)`,
          display:"flex", alignItems:"center", justifyContent:"center",
          cursor:"pointer",
          boxShadow:`0 4px 16px rgba(251,146,60,0.35)`,
        }}>
          <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:15, fontWeight:600, color:"#fff" }}>
            Download turbo model · 1.5 GB
          </span>
        </div>

        <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:12, color: T.textMuted, textAlign:"center", marginTop: T.sm }}>
          You can change the model later in Settings → STT Engine
        </div>
      </div>
    </div>
  );
};

/* ─────────────────────────────────────────────
   FRAME 2 — Generate: Idle State
───────────────────────────────────────────── */
const Frame2Idle = () => (
  <AppShell active="generate">
    <div style={{ display:"flex", flexDirection:"column", gap: T.lg, paddingTop: T.md }}>
      {/* Hero card */}
      <div style={{
        background: T.glassMid,
        backdropFilter:"blur(40px) saturate(180%)",
        border:`1px solid ${T.borderStrong}`,
        borderRadius: T.rXl,
        padding: T.xl,
        position:"relative", overflow:"hidden",
      }}>
        {/* Shimmer sweep */}
        <div style={{
          position:"absolute", top:0, left:"-100%", width:"60%", height:"100%",
          background:"linear-gradient(90deg, transparent, rgba(255,255,255,0.018), transparent)",
          animation:"shimmer 10s ease-in-out infinite",
          pointerEvents:"none",
        }}/>
        <div style={{ marginBottom: T.lg }}>
          <div style={{
            fontFamily:"Fraunces,ui-serif,serif", fontSize:28, fontWeight:400,
            color: T.textPrimary, letterSpacing:"-0.5px", lineHeight:1.2,
            marginBottom: T.xs,
          }}>
            What are we transcribing today?
          </div>
          <div style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textSecondary }}>
            Paste a YouTube link to get started.
          </div>
        </div>

        {/* URL Input */}
        <div style={{ display:"flex", gap: T.sm }}>
          <div style={{
            flex:1, height:52, borderRadius: T.rMd,
            background: T.glassLow,
            border:`1px solid ${T.borderSubtle}`,
            display:"flex", alignItems:"center",
            padding:`0 ${T.md}px`, gap: T.sm,
          }}>
            <span style={{ color: T.textMuted, fontSize:14 }}>🔗</span>
            <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textMuted }}>
              https://youtube.com/watch?v=...
            </span>
          </div>
          <div style={{
            height:52, padding:`0 ${T.lg}px`,
            borderRadius: T.rMd,
            background:`linear-gradient(135deg, ${T.accent}, #f97316)`,
            display:"flex", alignItems:"center", justifyContent:"center",
            cursor:"pointer", gap: T.xs,
            boxShadow:`0 4px 16px rgba(251,146,60,0.3)`,
          }}>
            <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, fontWeight:600, color:"#fff" }}>Load</span>
            <span style={{ color:"#fff", fontSize:14, opacity:0.9 }}>→</span>
          </div>
        </div>

        {/* Helper chips */}
        <div style={{ display:"flex", gap: T.xs, marginTop: T.md, flexWrap:"wrap" }}>
          {["youtube.com/watch", "youtu.be/shortlink", "playlists not yet supported"].map((hint, i) => (
            <div key={hint} style={{
              padding:`${T.xxs}px ${T.xs}px`, borderRadius: T.rPill,
              background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
              fontFamily:"Inter,system-ui,sans-serif", fontSize:11, color: i === 2 ? T.textMuted : T.textSecondary,
              fontStyle: i === 2 ? "italic" : "normal",
            }}>
              {i < 2 ? "✓ " : "✗ "}{hint}
            </div>
          ))}
        </div>
      </div>

      {/* Empty placeholders (collapsed state indicators) */}
      <div style={{ display:"flex", flexDirection:"column", gap: T.xs, opacity:0.35, pointerEvents:"none" }}>
        {["Video preview", "Configure", "Generate"].map((label, i) => (
          <div key={label} style={{
            height: i===2 ? 56 : 52, borderRadius: i===2 ? T.rMd : T.rLg,
            background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
            display:"flex", alignItems:"center", padding:`0 ${T.lg}px`,
          }}>
            <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textMuted }}>
              {label}
            </span>
          </div>
        ))}
      </div>
    </div>
    <style>{`
      @keyframes shimmer { 0%{left:-100%} 50%{left:140%} 100%{left:140%} }
      @keyframes pulse { 0%,100%{opacity:0.4; transform:scale(0.8)} 50%{opacity:1; transform:scale(1.2)} }
    `}</style>
  </AppShell>
);

/* ─────────────────────────────────────────────
   FRAME 3 — Generate: Metadata loaded + Configure expanded
───────────────────────────────────────────── */
const Frame3Config = () => {
  return (
    <AppShell active="generate">
      <div style={{ display:"flex", flexDirection:"column", gap: T.lg, paddingTop: T.md }}>

        {/* Hero card — URL loaded */}
        <div style={{
          background: T.glassMid,
          backdropFilter:"blur(40px) saturate(180%)",
          border:`1px solid ${T.borderStrong}`,
          borderRadius: T.rXl,
          padding: T.xl,
        }}>
          <div style={{ marginBottom: T.lg }}>
            <div style={{
              fontFamily:"Fraunces,ui-serif,serif", fontSize:28, fontWeight:400,
              color: T.textPrimary, letterSpacing:"-0.5px", lineHeight:1.2, marginBottom: T.xs,
            }}>
              What are we transcribing today?
            </div>
          </div>
          <div style={{ display:"flex", gap: T.sm }}>
            <div style={{
              flex:1, height:52, borderRadius: T.rMd,
              background: T.glassLow,
              border:`2px solid ${T.accent}`,
              boxShadow:`0 0 0 3px ${T.accentSoft}`,
              display:"flex", alignItems:"center",
              padding:`0 ${T.md}px`, gap: T.sm,
            }}>
              <span style={{ color: T.accent, fontSize:14 }}>🔗</span>
              <span style={{ fontFamily:"JetBrains Mono,ui-monospace,monospace", fontSize:13, color: T.textPrimary }}>
                youtube.com/watch?v=dQw4w9WgXcQ
              </span>
            </div>
            <div style={{
              height:52, padding:`0 ${T.lg}px`,
              borderRadius: T.rMd,
              background: T.glassLow, border:`1px solid ${T.borderSubtle}`,
              display:"flex", alignItems:"center",
              cursor:"pointer",
            }}>
              <span style={{ fontFamily:"Inter,system-ui,sans-serif", fontSize:14, color: T.textSecondary }}>✕ Clear</span>
            </div>
          </div>
        </div>

        {/* Video preview card — slide-up in */}
        <GlassCard>
          <div style={{ display:"flex", gap: T.lg, alignItems:"flex-start" }}>
            {/* Thumbnail */}
            <div style={{
              width:192, height:108, borderRadius: T.rMd, flexShrink:0,
              background:`linear-gradient(135deg, #1a1a2e, #16213e)`,
              overflow:"hidden", position:"relative",
              border:`1px solid ${T.borderSubtle}`,
            }}>
              {/* Fake thumbnail content */}
              <div style={{ width:"100%", height:"100%", background:"linear-gradient(135deg, #1e1e3a 0%, #2d1b4e 50%, #1a1a2e 100%)", display:"flex", alignItems:"center", justifyContent:"center" }}>

const WaveformBars = () => {
  const bars = Array.from({length:36}, (_, i) => i);
  return (
    <div style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:3, height:64 }}>
      {bars.map(i => {
        const h = 10 + Math.abs(Math.sin(i * 0.55)) * 44 + Math.abs(Math.cos(i * 0.3)) * 14;
        const delay = (i * 0.06) % 1.2;
        const isActive = i >= 10 && i <= 22;
        return (
          <div key={i} style={{
            width:4, height: h,
            borderRadius: T.rPill,
            background: isActive
              ? `linear-gradient(to top, ${T.accent}, rgba(251,146,60,0.4))`
              : `rgba(255,255,255,0.1)`,
            animation: isActive ? `wavebar ${0.8 + (i % 3) * 0.15}s ease-in-out ${delay}s infinite alternate` : "none",
            transformOrigin:"center",
          }}/>
        );
      })}
    </div>
  );
};
